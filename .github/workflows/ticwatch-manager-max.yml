name: TicWatch Manager Max

on:
  push:
    branches: ["ticwatch-ultimate-2026"]
    paths:
      - '.github/workflows/ticwatch-manager-max.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RESUKISU_COMMIT: '246d3e52e667cb72ce8f70c93b70d3b42b100b76'

jobs:
  build-spoofed-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Fetch exact latest ReSukiSU source
        run: |
          set -euxo pipefail
          git clone https://github.com/ReSukiSU/ReSukiSU.git src
          git -C src checkout "$RESUKISU_COMMIT"
          test "$(git -C src rev-parse HEAD)" = "$RESUKISU_COMMIT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust nightly and cargo-ndk
        run: |
          set -euxo pipefail
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add --toolchain nightly armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - name: Generate unique package namespace and signing identity
        run: |
          set -euxo pipefail
          cd src/manager
          chmod +x randomizer
          ./randomizer
          PKG=$(sed -n 's/^[[:space:]]*namespace = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n1)
          test -n "$PKG"
          test "$PKG" != 'com.resukisu.resukisu'
          PASS=$(openssl rand -hex 24)
          echo "::add-mask::$PASS"
          keytool -genkeypair \
            -alias ticwatch-unique \
            -keyalg RSA -keysize 3072 \
            -sigalg SHA256withRSA \
            -validity 3650 \
            -storetype JKS \
            -keystore unique-manager.jks \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Android,O=Mobile,L=Rome,C=IT"
          {
            echo "KEYSTORE_FILE=unique-manager.jks"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=ticwatch-unique"
            echo "KEY_PASSWORD=$PASS"
          } >> gradle.properties
          echo "MANAGER_PACKAGE=$PKG" >> "$GITHUB_ENV"
          echo "SIGN_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Build spoofed release APKs
        run: |
          set -euxo pipefail
          cd src/manager
          ./gradlew --no-daemon assembleRelease -Pcommit="$RESUKISU_COMMIT"
          find app/build/outputs/apk/release -type f -name '*.apk' -print

      - name: Build current armv7 ksud
        run: |
          set -euxo pipefail
          cd src
          clang --target=aarch64-linux-gnu -c -nostdlib \
            -o userspace/ksud/.lkm_image_bootstrap.o \
            userspace/ksud/src/lkm_image_bootstrap.S
          cd userspace/ksud
          cargo +nightly ndk b -P 26 -t armv7-linux-androideabi -r \
            -Z build-std-features="optimize_for_size" -Z trim-paths
          KSUD=$(find target -path '*/armv7-linux-androideabi/release/ksud' -type f | head -n1)
          test -s "$KSUD"
          file "$KSUD"

      - name: Repack armv7 manager with armv7 ksud and resign
        run: |
          set -euxo pipefail
          cd src
          mkdir -p target/armv7-linux-androideabi/release
          KSUD=$(find userspace/ksud/target -path '*/armv7-linux-androideabi/release/ksud' -type f | head -n1)
          cp "$KSUD" target/armv7-linux-androideabi/release/ksud

          RELEASE=manager/app/build/outputs/apk/release
          ARMV7=$(find "$RELEASE" -type f -name '*armeabi-v7a*release*.apk' | head -n1)
          test -s "$ARMV7"
          mkdir keep-apk
          cp "$ARMV7" keep-apk/
          rm -f "$RELEASE"/*.apk
          cp keep-apk/*.apk "$RELEASE"/

          python3 repack_apk_multi.py repack \
            -b release -t release -a armeabi-v7a \
            -K manager/unique-manager.jks \
            -A ticwatch-unique \
            -P "$SIGN_PASS" -S "$SIGN_PASS" \
            --strip
          FINAL=$(find dist -maxdepth 1 -type f -name '*.apk' | head -n1)
          test -s "$FINAL"
          unzip -l "$FINAL" | grep -q 'lib/armeabi-v7a/libksud.so'
          unzip -p "$FINAL" lib/armeabi-v7a/libksud.so > /tmp/libksud.so
          file /tmp/libksud.so | tee /tmp/KSUD-FILE.txt
          file /tmp/libksud.so | grep -q 'ELF 32-bit'

          mkdir -p "$GITHUB_WORKSPACE/manager-artifact"
          cp "$FINAL" "$GITHUB_WORKSPACE/manager-artifact/TicWatch-Unique-Manager-armeabi-v7a.apk"

      - name: Validate APK package certificate and integrity
        run: |
          set -euxo pipefail
          APK="$GITHUB_WORKSPACE/manager-artifact/TicWatch-Unique-Manager-armeabi-v7a.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/manager-artifact/APK-CERT.txt"
          CERT_SHA=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test -n "$CERT_SHA"
          REAL_PKG=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)
          test "$REAL_PKG" = "$MANAGER_PACKAGE"
          test "$REAL_PKG" != 'com.resukisu.resukisu'
          cp /tmp/KSUD-FILE.txt "$GITHUB_WORKSPACE/manager-artifact/KSUD-FILE.txt"
          printf 'package=%s\nsource=%s\ncert_sha256=%s\nabi=armeabi-v7a\nksud_embedded=yes\nmanager_mode=dynamic-manager-target\npackage_randomized=yes\nsigning_identity=unique-per-build\nprivate_key_retained=no\n' \
            "$REAL_PKG" "$RESUKISU_COMMIT" "$CERT_SHA" > "$GITHUB_WORKSPACE/manager-artifact/MANAGER-IDENTITY.txt"
          sha256sum "$APK" > "$GITHUB_WORKSPACE/manager-artifact/SHA256SUMS"

      - name: Upload unique manager
        uses: actions/upload-artifact@v4
        with:
          name: ticwatch-unique-spoofed-manager
          path: manager-artifact
          if-no-files-found: error
          retention-days: 30

name: TicWatch Manual-Hook Rollback Baseline

on:
  push:
    branches: ["ticwatch-ultimate-2026"]
    paths:
      - '.github/workflows/ticwatch-baseline-manual.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RESUKISU_COMMIT: '246d3e52e667cb72ce8f70c93b70d3b42b100b76'
  WINKMOON_COMMIT: '3929c55fbc7559af6df290d2c0f66dc551af161a'
  ANYKERNEL_COMMIT: 'ad62484a9cd193ba24991e617bae66e25c0d0228'
  LLVM_VERSION: '20.1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison dwarves libssl-dev libelf-dev bc python3 \
            python-is-python3 make cmake zip unzip curl wget gawk \
            gcc-arm-linux-gnueabihf binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf \
            libncurses-dev lz4 zstd xz-utils kmod
          wget -q -O llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          tar -xf llvm.tar.xz
          mv "LLVM-${LLVM_VERSION}-Linux-X64" aosp-clang
          echo "$GITHUB_WORKSPACE/aosp-clang/bin" >> "$GITHUB_PATH"
          echo "AOSP_CLANG_PATH=$GITHUB_WORKSPACE/aosp-clang" >> "$GITHUB_ENV"

      - name: Exact TicWatch source and latest pinned ReSukiSU
        run: |
          set -euxo pipefail
          mkdir -p kernel_workspace/common
          cd kernel_workspace/common
          git init
          git remote add origin https://github.com/Winkmoon/android_kernel_TicWatch-Pro5.git
          git fetch --depth=1 origin "$WINKMOON_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$WINKMOON_COMMIT"
          test "$(make -s kernelversion)" = '5.15.202'
          git clone https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          git -C KernelSU checkout "$RESUKISU_COMMIT"
          test "$(git -C KernelSU rev-parse HEAD)" = "$RESUKISU_COMMIT"
          ln -sfn "$(realpath --relative-to=drivers KernelSU/kernel)" drivers/kernelsu
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Configure manual-hook compatibility baseline
        run: |
          set -euxo pipefail
          cd kernel_workspace/common
          export PATH="$AOSP_CLANG_PATH/bin:$PATH"
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CC_COMPAT=arm-linux-gnueabihf-gcc LD_COMPAT=arm-linux-gnueabihf-ld gki_defconfig
          C=scripts/config
          F=out/.config
          $C --file "$F" -e KSU
          $C --file "$F" -e KSU_MANUAL_HOOK
          $C --file "$F" -d KSU_TRACEPOINT_HOOK
          $C --file "$F" -d KSU_SUSFS
          $C --file "$F" -e KSU_MULTI_MANAGER_SUPPORT
          $C --file "$F" -d KSU_TOOLKIT_SUPPORT
          $C --file "$F" -d KSU_DEBUG
          $C --file "$F" -e LTO_CLANG
          $C --file "$F" -d LTO_NONE
          $C --file "$F" -e LTO_CLANG_THIN
          $C --file "$F" -d LTO_CLANG_FULL
          $C --file "$F" -e THINLTO || true
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CC_COMPAT=arm-linux-gnueabihf-gcc LD_COMPAT=arm-linux-gnueabihf-ld olddefconfig
          grep -qx 'CONFIG_KSU=y' "$F"
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' "$F"
          grep -qx 'CONFIG_COMPAT=y' "$F"
          ! grep -qx 'CONFIG_KSU_SUSFS=y' "$F"

      - name: Build hard-fail
        run: |
          set -uxo pipefail
          cd kernel_workspace/common
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-
          export PATH="$AOSP_CLANG_PATH/bin:$PATH"
          export KCFLAGS='-Wno-error -Wno-deprecated-declarations'
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_USER=android-build
          export KBUILD_BUILD_HOST=abfarm
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CC_COMPAT=arm-linux-gnueabihf-gcc LD_COMPAT=arm-linux-gnueabihf-ld \
            2>&1 | tee "$GITHUB_WORKSPACE/baseline-build.log"
          RC=${PIPESTATUS[0]}
          exit "$RC"

      - name: Validate and package
        run: |
          set -euxo pipefail
          cd kernel_workspace/common
          test -s out/arch/arm64/boot/Image
          test -s out/Module.symvers
          REL=$(make -s O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CC_COMPAT=arm-linux-gnueabihf-gcc LD_COMPAT=arm-linux-gnueabihf-ld kernelrelease)
          git clone https://github.com/Winkmoon/AnyKernel3.git AnyKernel3
          git -C AnyKernel3 checkout "$ANYKERNEL_COMMIT"
          test "$(git -C AnyKernel3 rev-parse HEAD)" = "$ANYKERNEL_COMMIT"
          rm -rf AnyKernel3/.git
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          printf 'source=%s\nresukisu=%s\nhook=manual\nsusfs=no\nrelease=%s\n' \
            "$WINKMOON_COMMIT" "$RESUKISU_COMMIT" "$REL" > AnyKernel3/rollback-info.txt
          (cd AnyKernel3 && zip -qr9 ../TicWatch-Rollback-Manual-5.15.202.zip .)
          mkdir -p "$GITHUB_WORKSPACE/baseline-artifact"
          cp TicWatch-Rollback-Manual-5.15.202.zip "$GITHUB_WORKSPACE/baseline-artifact/"
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/baseline-artifact/Image"
          cp out/.config "$GITHUB_WORKSPACE/baseline-artifact/config"
          cp out/Module.symvers "$GITHUB_WORKSPACE/baseline-artifact/Module.symvers"
          sha256sum "$GITHUB_WORKSPACE/baseline-artifact/"* > "$GITHUB_WORKSPACE/baseline-artifact/SHA256SUMS"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticwatch-manual-baseline-diagnostics
          path: baseline-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload rollback baseline
        uses: actions/upload-artifact@v4
        with:
          name: ticwatch-manual-hook-rollback-5.15.202
          path: baseline-artifact
          if-no-files-found: error
          retention-days: 30

name: TicWatch obsolete artifact purge once
on:
  push:
    branches: [ticwatch-ultimate-2026]
    paths:
      - '.github/workflows/tw-artifact-purge-once.yml'
permissions:
  contents: read
  actions: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete artifacts without touching current source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for id in 10165020108 9623143621 9623142814 9623133802 9622966096 9622962416 9622962029 9622883243 9622882211 9622862667 9622850837 9622838833 9622838447 9622832688 9622817428; do
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" >/dev/null
          done
          echo "Removed 15 obsolete artifacts"

name: TicWatch cleanup history once
on:
  push:
    branches: [ticwatch-ultimate-2026]
    paths:
      - .github/workflows/ticwatch-cleanup-history-once.yml
permissions:
  actions: write
  contents: read
jobs:
  remove-old-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const retain = new Set([34507958323, 34507477782, 33011736910]);
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, per_page: 100 });
            let deleted = 0;
            const errors = [];
            for (const run of runs) {
              if (run.id === context.runId || retain.has(run.id) || run.status !== 'completed') continue;
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                deleted++;
              } catch(e) {
                errors.push(run.id + ': ' + e.message);
              }
            }
            core.info('CLEAN_HISTORY_RESULT=' + JSON.stringify({ deleted, retained: [...retain], errors }));
            if (errors.length) core.setFailed(errors.join('\n'));
